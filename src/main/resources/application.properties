spring.application.name=ferrecontrol
server.port=${PORT:8080}

# Configuracion de conexion a MySQL (ferrecontrol_db)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ferrecontrol_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


